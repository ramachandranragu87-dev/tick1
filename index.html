
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBMS Study Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #202638;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    background: #202c45;
    color: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    color: #cbd5e1;
    margin: 0;
}

.summary {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.progress-bar {
    height: 12px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #16a36a;
    transition: width 0.3s;
}

.unit {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px #00000008;
}

.unit h2 {
    margin-top: 0;
    color: #263a61;
}

.topic {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid #edf0f4;
    flex-wrap: wrap;
}

.topic:last-child {
    border-bottom: none;
}

.topic-name {
    flex: 1;
    min-width: 150px;
    font-size: 14px;
}

.topic.completed .topic-name {
    text-decoration: line-through;
    color: #8993a3;
}

.topic label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
}

input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #16a36a;
    cursor: pointer;
}

.review {
    accent-color: #2563eb !important;
}

.unit-progress {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 8px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px 5px 5px 0;
}

.reset {
    background: #fee2e2;
    color: #b91c1c;
}

.review-all {
    background: #dbeafe;
    color: #1d4ed8;
}

footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    padding: 20px;
}

@media(max-width: 500px) {
    body {
        padding: 12px;
    }

    .topic {
        gap: 8px;
    }

    .topic-name {
        flex-basis: 100%;
    }
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>📚 DBMS Study Tracker</h1>
    <p>Complete your syllabus • Revise • Achieve your goal</p>
</header>

<div class="summary">
    <h2>Overall Progress</h2>
    <h1 id="percentage">0%</h1>
    <div class="progress-bar">
        <div class="progress-fill" id="overallBar"></div>
    </div>
    <p id="count">0 / 27 Topics Completed</p>
    <p id="revisionCount">0 Topics Revised</p>
    <button class="review-all" onclick="markAllReviewed()">
        ✓ Mark All Completed Topics as Revised
    </button>
    <button class="reset" onclick="resetProgress()">
        Reset All Progress
    </button>
</div>

<div id="syllabus"></div>

<footer>
    Your study progress is automatically saved on this device.
</footer>

</div>

<script>

const units = [
{
    name: "UNIT 1 – Database Fundamentals",
    topics: [
        "Schema with Types",
        "ER Diagram",
        "Relational Algebra",
        "Database System Architecture"
    ]
},
{
    name: "UNIT 2 – SQL",
    topics: [
        "Aggregate Functions",
        "Clauses",
        "Joins",
        "Subqueries",
        "Views",
        "Triggers",
        "DDL, DML, DQL, TDL, TCL",
        "ORDER BY and GROUP BY"
    ]
},
{
    name: "UNIT 3 – Transactions",
    topics: [
        "ACID Properties",
        "Log-Based Protocol"
    ]
},
{
    name: "UNIT 4 – Storage and Indexing",
    topics: [
        "RAID Levels",
        "Problems on B+ Tree",
        "Problems on B-Tree",
        "Hashing (Static)",
        "Hashing (Dynamic)",
        "Query Optimization"
    ]
},
{
    name: "UNIT 5 – NoSQL Databases",
    topics: [
        "ClickHouse",
        "CRUD Operations with MongoDB",
        "NoSQL with Types"
    ]
}
];

let progress = JSON.parse(
    localStorage.getItem("dbmsTracker")
) || {};

function save() {
    localStorage.setItem(
        "dbmsTracker",
        JSON.stringify(progress)
    );
}

function render() {
    const syllabus = document.getElementById("syllabus");
    syllabus.innerHTML = "";

    let total = 0;
    let completed = 0;
    let revised = 0;

    units.forEach((unit, unitIndex) => {

        let unitCompleted = 0;
        let unitTotal = unit.topics.length;

        const section = document.createElement("section");
        section.className = "unit";

        const heading = document.createElement("h2");
        heading.textContent = unit.name;
        section.appendChild(heading);

        unit.topics.forEach((topic, topicIndex) => {

            total++;

            const key = `${unitIndex}-${topicIndex}`;

            if (!progress[key]) {
                progress[key] = {
                    done: false,
                    revised: false
                };
            }

            const data = progress[key];

            if (data.done) {
                completed++;
                unitCompleted++;
            }

            if (data.revised) revised++;

            const row = document.createElement("div");
            row.className = "topic";

            if (data.done) row.classList.add("completed");

            const name = document.createElement("span");
            name.className = "topic-name";
            name.textContent = topic;

            const doneLabel = document.createElement("label");
            const done = document.createElement("input");
            done.type = "checkbox";
            done.checked = data.done;

            done.addEventListener("change", () => {
                progress[key].done = done.checked;

                // Reset revision if topic is unchecked
                if (!done.checked) {
                    progress[key].revised = false;
                }

                save();
                render();
            });

            doneLabel.append(done, "Done");

            const reviewLabel = document.createElement("label");
            const review = document.createElement("input");
            review.type = "checkbox";
            review.className = "review";
            review.checked = data.revised;
            review.disabled = !data.done;

            review.addEventListener("change", () => {
                progress[key].revised = review.checked;
                save();
                render();
            });

            reviewLabel.append(review, "Revised");

            row.append(name, doneLabel, reviewLabel);
            section.appendChild(row);
        });

        const unitPercentage = Math.round(
            unitCompleted / unitTotal * 100
        );

        const unitInfo = document.createElement("p");
        unitInfo.className = "unit-progress";
        unitInfo.textContent =
            `Completed: ${unitCompleted}/${unitTotal} (${unitPercentage}%)`;

        const bar = document.createElement("div");
        bar.className = "progress-bar";

        const fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = unitPercentage + "%";

        bar.appendChild(fill);

        section.insertBefore(bar, section.children[1]);
        section.insertBefore(unitInfo, bar);

        syllabus.appendChild(section);
    });

    const percentage = Math.round(completed / total * 100);

    document.getElementById("percentage").textContent =
        percentage + "%";

    document.getElementById("overallBar").style.width =
        percentage + "%";

    document.getElementById("count").textContent =
        `${completed} / ${total} Topics Completed`;

    document.getElementById("revisionCount").textContent =
        `${revised} Topics Revised`;

    save();
}

function markAllReviewed() {
    units.forEach((unit, unitIndex) => {
        unit.topics.forEach((topic, topicIndex) => {
            const key = `${unitIndex}-${topicIndex}`;

            if (progress[key] && progress[key].done) {
                progress[key].revised = true;
            }
        });
    });

    save();
    render();
}

function resetProgress() {
    if (confirm("Are you sure you want to reset all study progress?")) {
        progress = {};
        save();
        render();
    }
}

render();

</script>
</body>
</html>
