
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithm Analysis Tracker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6fa;
    color: #202333;
    padding: 14px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.header {
    background: #fff;
    padding: 24px 20px;
    border-radius: 18px;
    margin-bottom: 18px;
    border: 1px solid #e9eaf0;
}

.header h1 {
    font-size: 23px;
    font-weight: 750;
    margin-bottom: 6px;
}

.header p {
    color: #777d90;
    font-size: 13px;
}

.progress-section {
    margin-top: 22px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 600;
}

.progress-count {
    color: #6254e8;
}

.progress-bar {
    height: 8px;
    background: #eeeeF5;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #6254e8;
    border-radius: 20px;
    transition: width 0.3s ease;
}

.revision-progress {
    background: #fff;
    border: 1px solid #e9eaf0;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 18px;
}

.revision-progress .progress-fill {
    background: #f59e0b;
}

.revision-progress .progress-count {
    color: #d97706;
}

.unit {
    background: #fff;
    border: 1px solid #e9eaf0;
    border-radius: 16px;
    margin-bottom: 14px;
    overflow: hidden;
}

.unit-header {
    padding: 17px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.unit-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.5;
}

.unit-count {
    font-size: 12px;
    color: #777d90;
    white-space: nowrap;
}

.topic-list {
    padding: 0 16px 12px;
}

.topic {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-top: 1px solid #f0f1f5;
}

.topic-name {
    font-size: 13.5px;
    line-height: 1.5;
    color: #3d4254;
    flex: 1;
    min-width: 0;
}

.topic.completed .topic-name {
    color: #999eae;
    text-decoration: line-through;
}

.topic-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.check-control {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.check-control span {
    font-size: 10px;
    color: #8a8fa1;
    font-weight: 600;
}

.check-control input {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid #d5d8e2;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    position: relative;
}

.check-control input:checked {
    background: #6254e8;
    border-color: #6254e8;
}

.check-control.revision input:checked {
    background: #f59e0b;
    border-color: #f59e0b;
}

.check-control input:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.check-control:active {
    opacity: 0.7;
}

@media (max-width: 480px) {
    body {
        padding: 10px;
    }

    .header {
        padding: 21px 16px;
    }

    .header h1 {
        font-size: 21px;
    }

    .unit-header {
        padding: 15px 13px;
    }

    .topic-list {
        padding: 0 13px 10px;
    }

    .topic {
        gap: 8px;
        padding: 13px 0;
    }

    .topic-name {
        font-size: 12.5px;
    }

    .topic-controls {
        gap: 10px;
    }

    .check-control input {
        width: 21px;
        height: 21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Algorithm Analysis</h1>
        <p>Unit-wise study and revision tracker</p>

        <div class="progress-section">
            <div class="progress-info">
                <span>Completed Topics</span>
                <span class="progress-count" id="completionCount">0 / 50</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="completionFill"></div>
            </div>
        </div>
    </div>

    <div class="revision-progress">
        <div class="progress-info">
            <span>Revised Topics</span>
            <span class="progress-count" id="revisionCount">0 / 50</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="revisionFill"></div>
        </div>
    </div>

    <div id="unitsContainer"></div>

</div>

<script>

const units = [

    {
        title: "Unit I: Algorithm Analysis Techniques",
        topics: [
            "Notion of an algorithm",
            "Importance & role of algorithms in computing",
            "Important problem types",
            "Analysis of algorithmic efficiency",
            "Time and Space Complexity",
            "Asymptotic notations and their properties",
            "Mathematical analysis for recursive and non-recursive algorithms",
            "String Algorithms: Naïve algorithm",
            "Rabin Karp Algorithm",
            "KMP Algorithm",
        ]
    },

    {
        title: "Unit II: Brute Force and Divide-And-Conquer",
        topics: [
            "Brute force: Selection sort",
            "String matching",
            "Exhaustive search",
            "Boyer Moore algorithm",
            "Travelling salesman problem",
            "Knapsack problem",
            "Assignment problem",
            "Huffman codes and data compression",
            "Divide and Conquer: Binary search",
            "Quick sort",
            "Heap sort",
        ]
    },

    {
        title: "Unit III: Dynamic Programming",
        topics: [
            "Ugly numbers",
            "Coin changing problem",
            "Friends pairing problem",
            "Golomb sequence",
            "Warshall's algorithm",
            "Floyd's algorithm",
            "Multi stage graph",
            "Optimal binary search trees",
            "Fractional Knapsack Problem"
        ]
    },

    {
        title: "Unit IV: Greedy Approach",
        topics: [
            "Activity selection problem",
            "Longest common subsequence",
            "Sieve of Sundaram",
            "Assign mice to holes",
            "Huffman trees",
            "Sparse matrix",
            "Bloom filter"
        ]
    },

    {
        title: "Unit V: Backtracking and Branch and Bound",
        topics: [
            "Backtracking",
            "Rat in maze",
            "Permutation and Combination",
            "N Queen problem",
            "Hamiltonian circuit problem",
            "Subset sum problem",
            "Graph Coloring",
            "Assignment problem",
            "Knapsack problem",
            "Travelling salesman problem"
        ]
    }

];

const STORAGE_KEY = "algorithmAnalysisRevisionTracker";

let savedProgress = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "{}"
);

let completedTopics = savedProgress.completed || {};
let revisedTopics = savedProgress.revised || {};

const unitsContainer = document.getElementById("unitsContainer");

const totalTopics = units.reduce(
    (total, unit) => total + unit.topics.length,
    0
);

function saveProgress() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            completed: completedTopics,
            revised: revisedTopics
        })
    );

}

function renderUnits() {

    unitsContainer.innerHTML = "";

    units.forEach((unit, unitIndex) => {

        const unitElement = document.createElement("div");
        unitElement.className = "unit";

        const completedInUnit = unit.topics.filter(
            (_, topicIndex) =>
                completedTopics[`${unitIndex}-${topicIndex}`]
        ).length;

        const revisedInUnit = unit.topics.filter(
            (_, topicIndex) =>
                revisedTopics[`${unitIndex}-${topicIndex}`]
        ).length;

        const unitHeader = document.createElement("div");
        unitHeader.className = "unit-header";

        const title = document.createElement("div");
        title.className = "unit-title";
        title.textContent = unit.title;

        const count = document.createElement("div");
        count.className = "unit-count";
        count.textContent = `${completedInUnit}/${unit.topics.length}`;

        unitHeader.appendChild(title);
        unitHeader.appendChild(count);

        const topicList = document.createElement("div");
        topicList.className = "topic-list";

        unit.topics.forEach((topic, topicIndex) => {

            const topicKey = `${unitIndex}-${topicIndex}`;

            const label = document.createElement("div");
            label.className = "topic";

            if (completedTopics[topicKey]) {
                label.classList.add("completed");
            }

            const topicName = document.createElement("div");
            topicName.className = "topic-name";
            topicName.textContent = topic;

            const controls = document.createElement("div");
            controls.className = "topic-controls";

            const completeLabel = document.createElement("label");
            completeLabel.className = "check-control";

            const completeCheckbox = document.createElement("input");
            completeCheckbox.type = "checkbox";
            completeCheckbox.checked = Boolean(
                completedTopics[topicKey]
            );

            const completeText = document.createElement("span");
            completeText.textContent = "Done";

            completeCheckbox.addEventListener("change", () => {

                if (completeCheckbox.checked) {
                    completedTopics[topicKey] = true;
                } else {
                    delete completedTopics[topicKey];
                }

                saveProgress();
                updateProgress();
                renderUnits();

            });

            completeLabel.appendChild(completeCheckbox);
            completeLabel.appendChild(completeText);

            const revisionLabel = document.createElement("label");
            revisionLabel.className = "check-control revision";

            const revisionCheckbox = document.createElement("input");
            revisionCheckbox.type = "checkbox";
            revisionCheckbox.checked = Boolean(
                revisedTopics[topicKey]
            );

            const revisionText = document.createElement("span");
            revisionText.textContent = "Revision";

            revisionCheckbox.addEventListener("change", () => {

                if (revisionCheckbox.checked) {
                    revisedTopics[topicKey] = true;
                } else {
                    delete revisedTopics[topicKey];
                }

                saveProgress();
                updateProgress();
                renderUnits();

            });

            revisionLabel.appendChild(revisionCheckbox);
            revisionLabel.appendChild(revisionText);

            controls.appendChild(completeLabel);
            controls.appendChild(revisionLabel);

            label.appendChild(topicName);
            label.appendChild(controls);

            topicList.appendChild(label);

        });

        unitElement.appendChild(unitHeader);
        unitElement.appendChild(topicList);

        unitsContainer.appendChild(unitElement);

    });

}

function updateProgress() {

    const completedCount = Object.values(completedTopics)
        .filter(Boolean).length;

    const revisedCount = Object.values(revisedTopics)
        .filter(Boolean).length;

    const completionPercentage =
        (completedCount / totalTopics) * 100;

    const revisionPercentage =
        (revisedCount / totalTopics) * 100;

    document.getElementById("completionCount").textContent =
        `${completedCount} / ${totalTopics}`;

    document.getElementById("completionFill").style.width =
        `${completionPercentage}%`;

    document.getElementById("revisionCount").textContent =
        `${revisedCount} / ${totalTopics}`;

    document.getElementById("revisionFill").style.width =
        `${revisionPercentage}%`;

}

renderUnits();
updateProgress();

</script>

</body>
</html>
